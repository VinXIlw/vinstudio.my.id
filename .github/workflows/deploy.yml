name: Deploy ke AnymHost (cPanel PHP)
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/views/**
            **/*.db
            **/*.sqlite
            **/*.log
            **/*.err
            **/.env*
            **/*test*
            **/cleanup*
            **/setup*
            **/run-*
            **/verify-*
            **/package*.json
            **/server.js
            **/admin-routes.js
            **/db-migrate.js
            **/profile-sync.js
            **/make-admin.js
            **/edit-profile.js
