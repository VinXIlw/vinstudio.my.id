name: Deploy ke AnymHost (cPanel PHP)
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.cpanel.yml
            **/README.md
            **/node_modules/**
            **/*.db
            **/*.sqlite
            **/*.sqlite3
            **/*.sql
            **/*.log
            **/*.err
            **/.env*
            **/storage/*.sqlite
            **/storage/*.db
            **/storage/.vault_*
            **/uploads/avatar-*
            **/uploads/photo-*
            **/uploads/profile-*
            **/uploads/banner-*
